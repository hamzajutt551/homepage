<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Team</title>
    
    <!-- ✅ Bootstrap CDN ✅ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./myTeam.css">
</head>
<body>
    <div class="container text-center mt-5">
        <h2>My Cricket Team</h2>
        <div class="row">
            <!-- ✅ Cricket Team Members ✅ -->
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./images/images/Babar-Azam.webp" alt="Babar Azam">
                    <div class="card-body">
                        <h5 class="card-title">Babar Azam</h5>
                        <p class="card-text">Role: Batsman</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./images/images/images.jpeg" alt="Shaheen Afridi">
                    <div class="card-body">
                        <h5 class="card-title">Shaheen Afridi</h5>
                        <p class="card-text">Role: Bowler</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./images/images/mohammad-rizwan-2024-11-cae8fab68499afed0e18034d233ad22d.avif" alt="Muhammad Rizwan">
                    <div class="card-body">
                        <h5 class="card-title">Muhammad Rizwan</h5>
                        <p class="card-text">Role: Wicketkeeper</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./images/images/images (1).jpeg" alt="Shadab Khan">
                    <div class="card-body">
                        <h5 class="card-title">Shadab Khan</h5>
                        <p class="card-text">Role: All-rounder</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./images/images/images (2).jpeg" alt="Fakhar Zaman">
                    <div class="card-body">
                        <h5 class="card-title">Fakhar Zaman</h5>
                        <p class="card-text">Role: Batsman</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./images/images/images (3).jpeg" alt="Hassan Ali">
                    <div class="card-body">
                        <h5 class="card-title">Hassan Ali</h5>
                        <p class="card-text">Role: Bowler</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./images/images/images (4).jpeg" alt="Haris Rauf">
                    <div class="card-body">
                        <h5 class="card-title">Haris Rauf</h5>
                        <p class="card-text">Role: Bowler</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card">
                    <img src="./images/images/imad-1-16296544043x2.webp" alt="Imad Wasim">
                    <div class="card-body">
                        <h5 class="card-title">Imad Wasim</h5>
                        <p class="card-text">Role: All-rounder</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- ✅ Back Button ✅ -->
        <button onclick="goBack()" class="btn btn-secondary bg-warning ">Back</button>
    </div>
    
    <!-- ✅ Bootstrap JS ✅ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- ✅ JavaScript for Back Button ✅ -->
    <script>
        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
