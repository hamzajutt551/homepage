<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Form</title>
    
    <!-- ✅ Bootstrap CDN ✅ -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="myProfile.css">


</head>
<body>

    <div class="form-container text-center">
        <h2>My Statement</h2>


        <form action="#" method="post">
            <div class="mb-3">
                <input type="text" id="MyDebit" name="MyDebit" placeholder="My Bets" class="form-control">
            </div>

            <div class="mb-3">
                <input type="text" id="MySponser" name="MySponser" placeholder="My Sponser" class="form-control" required>
            </div>

            <div class="mb-3">
                <input type="text" id="MyDeposit" name="MyDeposit" placeholder="My Deposit" class="form-control" required>
            </div>

            <div class="mb-3">
                <input type="text" id="MyWithdral" name="MyWithdral" placeholder="My Withdral" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-custom w-100">Update Profile</button>
        </form>

        <!-- ✅ Back Button ✅ -->
        <button onclick="goBack()" class="btn btn-secondary mt-3 w-100">Back</button>
    </div>

    <!-- ✅ Bootstrap JS ✅ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ✅ JavaScript for Back Button ✅ -->
    <script>
        function goBack() {
            window.history.back();
        }
    </script>

</body>
</html>
