<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cricket Team Management</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #121212;
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 165, 0, 0.6);
        }
        button {
            background: orange;
            color: #000;
            padding: 10px;
            margin: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: darkorange;
        }
        .hidden {
            display: none;
        }
        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #fff;
        }
        th {
            background: #222;
        }
        .delete-btn, .edit-btn {
            background: red;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin: 2px;
        }
        .delete-btn:hover {
            background: darkred;
        }
        .edit-btn {
            background: blue;
        }
        .edit-btn:hover {
            background: darkblue;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Manage Your Cricket Team</h2>
        <button onclick="showForm()">Add Player</button>
        <form id="playerForm" class="hidden" onsubmit="event.preventDefault(); addPlayer();">
            <input type="text" id="playerName" placeholder="Enter player name" required>
            <select id="playerRole">
                <option value="Batsman">Batsman</option>
                <option value="Bowler">Bowler</option>
                <option value="All-rounder">All-rounder</option>
                <option value="Wicketkeeper">Wicketkeeper</option>
            </select>
            <button type="submit">Save Player</button>
        </form>
        <table>
            <thead>
                <tr>
                    <th>Player Name</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="teamList"></tbody>
        </table>
    </div>
    
    <script>
        function showForm() {
            document.getElementById("playerForm").classList.toggle("hidden");
        }
        
        function addPlayer() {
            let name = document.getElementById("playerName").value;
            let role = document.getElementById("playerRole").value;
            let table = document.getElementById("teamList");
            
            let row = table.insertRow();
            let nameCell = row.insertCell(0);
            let roleCell = row.insertCell(1);
            let actions = row.insertCell(2);
            
            nameCell.textContent = name;
            roleCell.textContent = role;
            
            let deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.classList.add("delete-btn");
            deleteBtn.onclick = function() {
                table.deleteRow(row.rowIndex - 1);
            };
            
            let editBtn = document.createElement("button");
            editBtn.textContent = "Edit";
            editBtn.classList.add("edit-btn");
            editBtn.onclick = function() {
                document.getElementById("playerName").value = nameCell.textContent;
                document.getElementById("playerRole").value = roleCell.textContent;
                table.deleteRow(row.rowIndex - 1);
                showForm();
            };
            
            actions.appendChild(editBtn);
            actions.appendChild(deleteBtn);
            
            document.getElementById("playerName").value = "";
            showForm();
        }
    </script>
</body>
</html>
